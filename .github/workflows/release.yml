name: Release Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - run: cd backend && go mod tidy
      - run: cd backend && test -z "$(gofmt -l .)"
      - run: cd backend && go build ./...
      - run: cd backend && go vet ./...
      - run: cd backend && go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Build ARM64 (Termux)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o ../second-brain-server-arm64 ./cmd/server
      - name: Build AMD64 (dev/CI)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o ../second-brain-server-amd64 ./cmd/server
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: Auto-built from `main`. ARM64 for Termux, AMD64 for dev/CI.
          files: |
            second-brain-server-arm64
            second-brain-server-amd64
          prerelease: true
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
