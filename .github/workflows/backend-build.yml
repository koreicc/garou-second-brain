name: Backend Build

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_binary:
        description: "Build ARM64 binary for Termux"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: backend/go.sum
      - run: cd backend && go mod tidy
      - name: Check formatting
        run: cd backend && test -z "$(gofmt -l .)"
      - run: cd backend && go build ./...
      - run: cd backend && go vet ./...
      - run: cd backend && go test -race -count=1 ./...

  binary:
    if: github.event_name == 'workflow_dispatch' && inputs.build_binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Build ARM64 binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o ../second-brain-server-arm64 ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: second-brain-server-arm64
          path: second-brain-server-arm64
          compression-level: 0
